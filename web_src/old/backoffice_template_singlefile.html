<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: studio control room. Left rail = channels (pages), main = monitor wall of panels; red "on air" light marks what to act on. */
:root {
  /* ui-ux-pro-max design system: Data-Dense Dashboard · corporate navy + amber · density 8 */
  --bg: #F8FAFC; --surface: #FFFFFF; --sunk: #EEF2F8; --ink: #0F2557; --ink-2: #475569; --ink-3: #64748B;
  --line: #DBE4F3; --accent: #1E40AF; --accent-soft: #DBEAFE; --accent-ink: #FFFFFF;
  --up: #D97706; --down: #3B82F6; --good: #15803D; --good-soft: #DCFCE7; --cool: #3B82F6; --cool-soft: #E0ECFE; --warn: #B45309; --warn-soft: #FEF3C7;
  --gz: #7C3AED; --gy: #0EA5E9; --gx: #0F766E;
  --l1: #0F2557; --l2: #64748B; --l3: #CBD5E1;
  --f-display: "Fira Sans", "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", sans-serif;
  --f-body: "Fira Sans", "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --f-num: "Fira Code", "Fira Sans", ui-monospace, monospace;
  --r: 8px; --shadow: 0 1px 2px rgba(15, 37, 87, .06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1220; --surface: #111A2E; --sunk: #172238; --ink: #E2E8F0; --ink-2: #A3B1C6; --ink-3: #7B8AA3;
  --line: #22304D; --accent: #60A5FA; --accent-soft: #172B54; --accent-ink: #0B1220;
  --up: #F59E0B; --down: #60A5FA; --good: #4ADE80; --good-soft: #12301F; --cool: #60A5FA; --cool-soft: #15264A; --warn: #FBBF24; --warn-soft: #3A2B0C;
  --gz: #A78BFA; --gy: #38BDF8; --gx: #2DD4BF; --l1: #E2E8F0; --l2: #8796AE; --l3: #334360;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1220; --surface: #111A2E; --sunk: #172238; --ink: #E2E8F0; --ink-2: #A3B1C6; --ink-3: #7B8AA3;
  --line: #22304D; --accent: #60A5FA; --accent-soft: #172B54; --accent-ink: #0B1220;
  --up: #F59E0B; --down: #60A5FA; --good: #4ADE80; --good-soft: #12301F; --cool: #60A5FA; --cool-soft: #15264A; --warn: #FBBF24; --warn-soft: #3A2B0C;
  --gz: #A78BFA; --gy: #38BDF8; --gx: #2DD4BF; --l1: #E2E8F0; --l2: #8796AE; --l3: #334360;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.25; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; } h2 { font-size: 20px; } h3 { font-size: 16px; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--cool); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .small { font-size: 13px; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 22px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px));
  border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.onair { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex: none; }
.brand b { font-family: var(--f-display); font-size: 18px; }
.brand span { display: block; font-size: 12px; color: var(--ink-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--sunk); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav a[aria-current="page"] .ico { color: var(--accent); }
.nav .ico { width: 18px; height: 18px; flex: none; }
.nav a.cta { margin-top: 6px; border: 1px dashed var(--line); }
.side .foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 0 8px; display: grid; gap: 8px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--cool); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }

main { padding-block: 28px 56px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1180px; width: 100%; }
.page { display: grid; gap: 22px; }
.page-head { display: grid; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
.lead { color: var(--ink-2); max-width: 68ch; }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kpi { display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--ink-2); }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; cursor: pointer; display: grid; gap: 8px; align-content: start; min-width: 0; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .more { font-size: 13px; color: var(--accent); font-weight: 600; }
.insight { border-left: 0; }
.card > .chip { justify-self: start; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.chip.hot { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.cool { background: var(--cool-soft); color: var(--cool); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.note { font-size: 13px; color: var(--ink-2); background: var(--sunk); border-radius: 8px; padding: 10px 12px; }
.note.warn { background: var(--warn-soft); color: var(--ink); }
.term { border-bottom: 1px dotted var(--ink-3); cursor: help; background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; }
.qbtn { position: relative; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 12px; line-height: 1; cursor: pointer; color: var(--ink-2); flex: none; }

/* bars */
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(84px, 150px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.bar-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 12px; background: var(--sunk); border-radius: 0 4px 4px 0; position: relative; }
.fill { height: 100%; border-radius: 0 4px 4px 0; }
.bar-row .val { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 56px; text-align: right; }
.stack { display: flex; height: 16px; gap: 2px; border-radius: 4px; overflow: hidden; }
.stack i { display: block; height: 100%; min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.stack-lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); gap: 6px; flex-wrap: wrap; }

/* diverging lift chart */
.lift-row { display: grid; grid-template-columns: minmax(96px, 170px) minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: 14px; }
.lift-track { position: relative; height: 14px; }
.lift-track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
.lift-fill { position: absolute; top: 0; height: 100%; border-radius: 3px; }

/* table */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--ink-2); font-weight: 600; }
th button { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; color: inherit; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--sunk); }
.up { color: var(--up); font-weight: 600; } .down { color: var(--down); }

/* planner */
.planner { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.form { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.field { display: grid; gap: 8px; }
.field > label, .field > .flabel { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 12px; color: var(--ink-3); }
select, input[type="number"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rec { display: grid; gap: 10px; }
.rec-card { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.rank { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; background: var(--sunk); }
.rec-card:first-child .rank { background: var(--accent); color: var(--accent-ink); }
.score { text-align: right; }
.score b { font-family: var(--f-display); font-size: 22px; }
.big { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.example { font-size: 12px; color: var(--warn); font-weight: 600; }

/* dialog */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
dialog::backdrop { background: rgba(10, 16, 24, .45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.dlg-body { padding: 18px 20px 22px; display: grid; gap: 16px; }
.xbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 18px; }
.gloss dt { font-weight: 600; margin-top: 10px; } .gloss dd { margin: 2px 0 0; color: var(--ink-2); }
.gloss dt.hl { color: var(--accent); }

#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 260px; }


/* dashboard */
.dash-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; }
.fbar select { width: auto; padding: 5px 8px; }
.fbar .flabel { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; margin-left: 6px; }
.fchip { border: 0; cursor: pointer; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tile .l { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.tile-mid { display: grid; gap: 4px; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
.tile .d { font-size: 12px; color: var(--ink-3); min-height: 18px; }
.tile .d.up { color: var(--up); font-weight: 600; } .tile .d.down { color: var(--down); font-weight: 600; }
.spark { display: block; width: 100%; max-width: 100%; }
.dgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.span4 { grid-column: span 4; } .span5 { grid-column: span 5; } .span6 { grid-column: span 6; } .span7 { grid-column: span 7; } .span8 { grid-column: span 8; } .span12 { grid-column: span 12; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; }
.chart .ax { font-size: 11px; fill: var(--ink-3); font-family: var(--f-body); }
.chart .lbl { font-size: 12.5px; fill: var(--ink); font-family: var(--f-body); }
.chart .lbl.dim { fill: var(--ink-3); }
.chart .val { font-size: 12px; fill: var(--ink-2); font-family: var(--f-body); font-weight: 600; }
.chart .blab { fill: var(--ink-2); font-family: var(--f-body); font-weight: 600; font-variant-numeric: tabular-nums; pointer-events: none; }
.chart .hit { cursor: pointer; }
.chart .hit:hover rect, .chart rect.hit:hover, .chart circle.hit:hover { opacity: .8; }
.cap { font-size: 12px; color: var(--ink-3); }
.cap.sub { display: block; font-weight: 400; margin-top: 2px; }
td.nowrap { white-space: nowrap; }
.mini3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mini3 > div { display: grid; }
.mini3 b { font-family: var(--f-display); font-size: 18px; }
.pairs { display: grid; gap: 12px; }
.pair { display: grid; grid-template-columns: 90px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 10px; row-gap: 4px; background: none; border: 0; padding: 4px; border-radius: 8px; cursor: pointer; text-align: left; }
.pair:hover { background: var(--sunk); }
.pair .pl { grid-row: span 2; font-weight: 600; align-self: center; }
.pb { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 8px; align-items: center; }
table.heat td.cell { text-align: center; }
table.heat th { text-align: center; }
th.rot { white-space: normal; min-width: 70px; font-size: 11px; vertical-align: bottom; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.inbar { display: inline-block; width: 46px; height: 6px; background: var(--sunk); border-radius: 3px; margin-right: 8px; vertical-align: middle; overflow: hidden; }
.inbar i { display: block; height: 100%; background: var(--accent); }
.eptitle { max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
.search { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: min(320px, 100%); }
.scrolly { max-height: 460px; overflow-y: auto; }

/* business pages */
.ngroup { font-size: 11px; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 12px 10px 4px; }
.tile .v, .kpi .v, .big, .mini3 b, .score b { font-family: var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .v { font-size: 21px; overflow: hidden; text-overflow: ellipsis; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; cursor: pointer; transition: opacity .15s; }
.btn:hover { opacity: .88; } .btn .ico { width: 16px; height: 16px; }
.pack .btn { justify-self: start; background: var(--surface); color: var(--accent); }
.rank-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.rank-list li { display: grid; gap: 1px; }
.rank-list li .chip { justify-self: start; }
th.sel { color: var(--accent); }
.chart .q { font-weight: 600; fill: var(--ink-2); }
.chart .small-lbl { font-size: 11px; fill: var(--ink-2); }
.inbar.wide { width: 90px; }
tr.hl td { background: var(--warn-soft); }
.copybox { width: 100%; font: inherit; font-size: 13px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.card, .tile, .panel { transition: border-color .2s; }
@media (max-width: 820px) { .ngroup { display: none; } }

/* video covers */
.thumb { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 10px; background: var(--sunk); }
.eptitle { max-width: 420px; }
.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.cover { display: grid; gap: 6px; align-content: start; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; text-decoration: none; min-width: 0; }
.cover-img { position: relative; display: block; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; background: var(--sunk); }
.cover-thumb { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
.cover:hover .cover-thumb { transform: scale(1.04); }
.cover-badge { position: absolute; right: 6px; bottom: 6px; background: rgba(8, 14, 28, .82); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 5px; font-family: var(--f-num); }
.cover-t { font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hero { position: relative; display: block; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; max-height: 320px; background: var(--sunk); }
.hero-img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(1.05); }
.hero .play { position: absolute; inset: 0; margin: auto; width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: rgba(8, 14, 28, .75); color: #fff; font-size: 22px; padding-left: 4px; transition: transform .2s; }
.hero:hover .play { transform: scale(1.08); }
.hero-cap { position: absolute; left: 10px; bottom: 10px; background: rgba(8, 14, 28, .75); color: #fff; font-size: 12px; padding: 3px 8px; border-radius: 5px; }
@media (prefers-reduced-motion: reduce) { .cover-thumb, .hero .play { transition: none; } .cover:hover .cover-thumb, .hero:hover .play { transform: none; } }

/* planner: requirement form + report paper (paper keeps a white print look in both themes) */
.req { gap: 16px; max-width: 900px; }
.req-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.req input[type="text"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.req-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; }
.big-btn { font-size: 15px; padding: 10px 18px; min-height: 44px; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--warn-soft); color: var(--ink); border-color: var(--warn); }
.rtoolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding-block: 8px; }
.rtoolbar .grow { flex: 1; }

    // 4. the chosen ad format -> how people will talk about it
    el("section", { class: "rsec" }, el("h2", null, "3. โฆษณาได้กี่แบบ และคนจะพูดถึงยังไง"),
      ed("f-lead", "p", `รายการทำได้ ${FORMATS.length} รูปแบบ เรียงจากแบบที่คนพูดถึงมากที่สุดไปน้อยที่สุด เลือกได้ตามงบและความเหมาะกับสินค้า`),
      FORMATS.map((f) => {
        const I = FORMAT_INFO[f.id], mn = Math.round(I.perEp() * P.n);
        return el("div", { class: "pfbox" },
          el("div", { class: "pformat" }, el("span", { class: "plevel " + I.kind }, I.level), el("div", null, el("b", { class: "pfname" }, f.name), ed("f-what-" + f.id, "p", I.what))),
          el("p", { class: "plab" }, "สิ่งที่คาดว่าจะเกิดในคอมเม้น"), el("ul", { class: "pwhy big" }, I.talk.map((t, j) => ed(`f-talk-${f.id}-${j}`, "li", t))),
          ed("f-num-" + f.id, "p", mn ? `ถ้าลง ${P.n} EP คาดว่าจะมีคอมเม้นพูดถึงสินค้าราว ${mn} ครั้ง` : "ไม่คาดว่าจะมีคอมเม้นพูดถึงสินค้ามากนัก", { class: "ed pstrong" }),
          ed("f-ev-" + f.id, "p", I.evidence(), { class: "ed psmall" }),
          ed("f-tip-" + f.id, "p", "คำแนะนำ: " + I.tip, { class: "ed ptip" }));
      }),
      el("table", { class: "pcompare" }, el("thead", null, el("tr", null, el("th", null, "รูปแบบ"), el("th", null, "คนพูดถึง"))),
        el("tbody", null, FORMATS.map((f) => el("tr", null, el("td", null, f.name), el("td", null, FORMAT_INFO[f.id].level)))))),
    // 5. safety
    el("section", { class: "rsec" }, el("h2", null, "4. ความปลอดภัยของแบรนด์"),
      ed("safety", "p", P.safety.length ? `ไม่ลง EP ที่มีประเด็นอ่อนไหวระดับ${P.safety.join(" และ ")} หลังตัดออกแล้วยังมี EP ให้เลือก ${N.avail.map((a) => `${a.name} ${a.ok} จาก ${a.all} EP`).join(" · ")}` : "ลูกค้าไม่ได้ระบุข้อจำกัด ควรถามก่อนจองว่ารับประเด็นอ่อนไหว เช่น คดีทางเพศ หรือมีคนเสียชีวิต ได้ไหม")),
    // 6. conversion
    el("section", { class: "rsec" }, el("h2", null, "5. ยอดขาย (Conversion)"),
      ed("conv", "p", est == null ? "ยังประเมินยอดขายไม่ได้ เพราะยังไม่มีข้อมูลยอดขายจริงจากแบรนด์ แนะนำให้ใช้โค้ดส่วนลดแยกทุก EP เพื่อวัดผลจริงในแคมเปญนี้" : `ถ้าสมมติว่าทุก 1,000 วิวมีคนใช้โค้ด ${P.rate} ครั้ง จะได้ราว ${fmt(est)} ครั้ง ตัวเลขนี้เป็นสมมติฐาน ยังไม่ได้พิสูจน์ด้วยข้อมูลจริง`)),
    el("footer", { class: "rsec pfoot" }, el("p", { class: "plab" }, "ข้อควรรู้"),
      el("ul", { class: "pwhy small" }, [
        `ตัวเลขมาจากคนที่คอมเม้นบน YouTube ${D.n_eps} EP ปี 2569 (${fmt(D.n_people)} คน) ไม่ใช่คนดูทั้งหมด`,
        "ยอดวิวและคอมเม้นเป็นค่ากลางของปีนี้ EP จริงอาจได้มากหรือน้อยกว่ามากตามความดังของเรื่อง",
        `จำนวนคนไม่ซ้ำคลาดได้ราว ±${Math.round(D.reach.median_abs_error * 100)}% และวัยเป็นค่าประเมินจากข้อความ`,

  let tmr; paper.addEventListener("input", (e) => { if (!e.target.closest(".ed")) return; clearTimeout(tmr); tmr = setTimeout(() => { try { const s = {}; paper.querySelectorAll(".ed").forEach((x) => (s[x.dataset.k] = x.textContent)); localStorage.setItem(key, JSON.stringify(s)); } catch (err) { /* draft not kept */ } }, 400); });
  const status = el("span", { class: "cap", role: "status" });
  let editing = false;
  const editBtn = el("button", { type: "button", class: "btn ghost", "aria-pressed": "false", onclick: () => { editing = !editing; paper.querySelectorAll(".ed").forEach((x) => x.contentEditable = String(editing)); paper.classList.toggle("editing", editing); editBtn.setAttribute("aria-pressed", String(editing)); editBtn.lastChild.textContent = editing ? "เสร็จสิ้นการแก้ไข" : "แก้ไขข้อความ"; status.textContent = editing ? "คลิกข้อความที่มีเส้นประเพื่อแก้ ระบบจำไว้ในเบราว์เซอร์นี้" : ""; } }, icon("M4 20h4L19 9l-4-4L4 16zM14 6l4 4"), "แก้ไขข้อความ");
  const pdfBtn = el("button", { type: "button", class: "btn", onclick: () => exportPdf(paper, status, editBtn, () => editing) }, icon("M12 4v11M7 10l5 5 5-5M5 20h14"), "Export PDF");

    el("div", { class: "rtoolbar" }, el("button", { type: "button", class: "btn ghost", onclick: onBack }, "← แก้โจทย์"), el("span", { class: "grow" }), status, editBtn, pdfBtn),
    el("div", { class: "paper-wrap" }, paper),
  ];
}

async function exportPdf(paper, status, editBtn, isEditing) {
  if (isEditing()) editBtn.click();
  const say = (t) => (status.textContent = t);
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (!dl) { say("Export PDF ใช้ได้เมื่อเปิดหน้านี้ใน claude.ai"); return; }
  if (!window.html2canvas || !window.jspdf) { say("โหลดตัวสร้าง PDF ไม่สำเร็จ ลองรีเฟรชหน้า"); return; }
  say("กำลังสร้าง PDF…");
  try {
    const { jsPDF } = window.jspdf, pdf = new jsPDF({ unit: "mm", format: "a4" });
    const M = 12, W = 210 - 2 * M, H = 297 - 2 * M; let y = M;
    for (const sec of paper.querySelectorAll(".rsec")) {
      const cv = await window.html2canvas(sec, { scale: 2, backgroundColor: "#ffffff", logging: false });
      const h = cv.height * W / cv.width;
      if (y + h > M + H && y > M) { pdf.addPage(); y = M; }
      if (h <= H) {
        pdf.addImage(cv, "JPEG", M, y, W, h, undefined, "FAST");
        const sr = sec.getBoundingClientRect(), k = W / sr.width;
        sec.querySelectorAll("a[href^='https://']").forEach((a) => { const r = a.getBoundingClientRect(); pdf.link(M + (r.left - sr.left) * k, y + (r.top - sr.top) * k, r.width * k, r.height * k, { url: a.href }); });
        y += h + 3; continue;
      }
      const pagePx = Math.floor(cv.width * H / W);           // section taller than a page: slice it
      for (let top = 0; top < cv.height; top += pagePx) {
        const part = document.createElement("canvas"); part.width = cv.width; part.height = Math.min(pagePx, cv.height - top);
        part.getContext("2d").drawImage(cv, 0, top, cv.width, part.height, 0, 0, cv.width, part.height);
        if (top > 0) { pdf.addPage(); y = M; }
        pdf.addImage(part, "JPEG", M, y, W, part.height * W / cv.width, undefined, "FAST"); y += part.height * W / cv.width + 3;
      }
    }
    const name = `ReachRadar_${(P.brand || P.campaign || "campaign").replace(/[\\/:*?"<>|]+/g, "").slice(0, 40)}.pdf`;
    await dl.save({ filename: name, data: pdf.output("blob") });
    say("บันทึก PDF แล้ว");
  } catch (e) {
    say(e && e.code === "declined" ? "ยกเลิกการบันทึก" : e && e.code === "rate_limited" ? "มีหน้าต่างบันทึกเปิดอยู่ ลองอีกครั้ง" : "สร้าง PDF ไม่สำเร็จ ลองอีกครั้ง");
  }
}

const RENDER = { home: pageHome, match: pageMatch, slots: pageSlots, packages: pagePackages, safety: pageSafety, audience: pageAudience, content: pageContent, brands: pageBrands, planner: pagePlanner };
function nav(cur) {
  $("#nav").replaceChildren(...PAGES.map((p) => p.group ? el("span", { class: "ngroup" }, p.group) : el("a", { href: "#" + p.id, class: p.cta ? "cta" : null, "aria-current": p.id === cur ? "page" : null }, icon(p.ico), p.name)));
}
function go(id) { if (location.hash !== "#" + id) location.hash = id; else route(); }
function route() {
  let id = (location.hash || "#home").slice(1); if (id === "content") id = "home";   // merged into the overview
  const cur = RENDER[id] ? id : "home";
  nav(cur); if (dlg.open) dlg.close(); tip.hidden = true;
  $("#main").replaceChildren(RENDER[cur]()); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
$("#foot-data").textContent = `ข้อมูล ${D.date_range[0]} ถึง ${D.date_range[1]} · อัปเดต ${D.generated.slice(0, 10)}`;
route();
})();
